# cobaiter model registry (externally injected, hand-managed).
#
# Maps each downstream LiteLLM model name to its routing capabilities + policy.
# This file is the SOURCE OF TRUTH: on startup cobaiter reconciles the registry
# to match it exactly (models not listed here are removed).
#
# Fields per model:
#   model           : the exact model name as exposed by LiteLLM (/v1/models)
#   description     : free-text USE-CASE DOMAIN ONLY — what subject / kind of task
#                     this model is for (e.g. software-development vs non-coding
#                     general use). Used only as a FALLBACK when `task_examples`
#                     is empty (see below); kept as a human-readable summary of
#                     the domain even when `task_examples` is set. Do NOT mention
#                     difficulty or capability ("hard", "advanced", "複雑",
#                     "高難度", "low-difficulty"), cost, speed, or INPUT LENGTH:
#                     difficulty is estimated separately (one per-task heuristic)
#                     and matched against `tier` in code, and non-domain wording
#                     only blurs the embedding similarity.
#                     Models that SHARE a domain (e.g. a think/no-think pair, or
#                     several coding models) should share the SAME description —
#                     they then tie on relevance — and let `tier`/`cost`
#                     distinguish them.
#                     STATE POSITIVELY, never by negation/exclusion ("〜以外",
#                     "〜ではない", "〜には不向き"). An embedding model cannot read
#                     negation the way an LLM classifier could — the excluded
#                     domain's own keywords ("コーディング", "コード", "設計") still
#                     sit in the text and pull the vector toward that domain,
#                     shrinking the very separation relevance depends on. Measured
#                     on the actual embedding model in use: a negation-heavy pair
#                     of descriptions came out only 0.80 cosine-separated and even
#                     flipped the winner on a plain non-coding question; rewriting
#                     both purely positively (distinct domain vocabulary only) cut
#                     that to 0.49 and fixed the flip. Each description must also
#                     stand alone: don't reference or contrast against other
#                     domains by name, since new domains are expected to be added
#                     over time and cross-references don't scale past two.
#   task_examples   : short, representative task phrases for this model's domain
#                     (same content rules as `description` above: positively
#                     stated, domain-only, shared across a domain's tier
#                     variants). When set, relevance is scored as the top-2-mean
#                     cosine similarity between the conversation digest and EACH
#                     example (multi-prototype matching) instead of a single
#                     description vector — this lets one domain cover several
#                     distinct sub-tasks (e.g. coding: bugfix / review / design /
#                     CI investigation) without a single sentence having to carry
#                     all of them, and damps per-example embedding brittleness
#                     (short JP text can be sensitive to minor phrasing). When
#                     empty, relevance falls back to `description` as a single
#                     one-item example. Target 3-6 examples per model group, and
#                     keep counts roughly even ACROSS domains — an uneven count
#                     (one domain with many examples, another with few) statistically
#                     biases relevance toward whichever domain has more examples.
#   cost            : relative monetary cost (e.g. USD per 1M tokens). Local = 0.
#                     The router prefers cheaper models unless a pricier one is
#                     clearly more suitable.
#   tier            : capability level as an integer; larger = more capable / slower
#                     / heavier. NOT shown to the classifier. Used in code: matched
#                     against the task's difficulty for capability-fit (under-powered
#                     models are penalised) and as a light penalty so the LOWEST tier
#                     still suitable wins (a same-cost local think/no-think pair stays
#                     ordered).
#   context_window  : max input tokens (used by the hard-constraint filter)
#   multimodal      : true if it accepts images
#   supports_tools  : true if it supports function/tool calling
#   is_local        : true if served locally / privacy-safe
#   fallback_chain  : ordered failover targets when this model is unavailable
#
# NOTE: cost/tier/capability values below are starting points — tune them to your
# backends. The embedding model (COBAITER_EMBEDDING_MODEL) is NOT a routable
# target and is intentionally omitted here.

models:
  - model: gpt-5.5
    description: "雑談・日常会話・質問応答。文章作成・要約・翻訳・校正・タイトル作成。数学や論理を含む一般的な推論、時事や雑学の相談、旅行・レシピ・買い物などの相談ごと。"
    task_examples:
      - "今日の天気について雑談したい"
      - "この文章を要約してほしい"
      - "この英語の文章を日本語に翻訳してほしい"
      - "旅行のプランについて相談したい"
      - "簡単な数学の問題を解いてほしい"
      - "この文章の誤字脱字を校正してほしい"
    cost: 5
    tier: 6
    context_window: 262144
    multimodal: false
    supports_tools: true
    is_local: false
    fallback_chain: [bbrfkr-llm-general]

  - model: bbrfkr-llm-general
    description: "雑談・日常会話・質問応答。文章作成・要約・翻訳・校正・タイトル作成。数学や論理を含む一般的な推論、時事や雑学の相談、旅行・レシピ・買い物などの相談ごと。"
