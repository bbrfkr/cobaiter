# cobaiter model registry (externally injected, hand-managed).
#
# Maps each downstream LiteLLM model name to its routing capabilities + policy.
# This file is the SOURCE OF TRUTH: on startup cobaiter reconciles the registry
# to match it exactly (models not listed here are removed).
#
# Fields per model:
#   model           : the exact model name as exposed by LiteLLM (/v1/models)
#   description     : free-text USE-CASE DOMAIN ONLY — what subject / kind of task
#                     this model is for (e.g. software-development vs non-coding
#                     general use). Shown to the classifier, which scores TOPIC
#                     relevance from it. Do NOT mention difficulty or capability
#                     ("hard", "advanced", "複雑", "高難度", "low-difficulty"), cost,
#                     speed, or INPUT LENGTH: difficulty is judged separately (one
#                     per-task estimate) and matched against `tier` in code, so
#                     putting difficulty words here makes a weak classifier match
#                     "hard task" to "advanced-sounding model" and ignore the actual
#                     domain. Models that SHARE a domain (e.g. a think/no-think pair,
#                     or several coding models) should share the SAME description and
#                     let `tier`/`cost` distinguish them.
#   cost            : relative monetary cost (e.g. USD per 1M tokens). Local = 0.
#                     The router prefers cheaper models unless a pricier one is
#                     clearly more suitable.
#   tier            : capability level as an integer; larger = more capable / slower
#                     / heavier. NOT shown to the classifier. Used in code: matched
#                     against the task's difficulty for capability-fit (under-powered
#                     models are penalised) and as a light penalty so the LOWEST tier
#                     still suitable wins (a same-cost local think/no-think pair stays
#                     ordered).
#   context_window  : max input tokens (used by the hard-constraint filter)
#   multimodal      : true if it accepts images
#   supports_tools  : true if it supports function/tool calling
#   is_local        : true if served locally / privacy-safe
#   fallback_chain  : ordered failover targets when this model is unavailable
#
# NOTE: cost/tier/capability values below are starting points — tune them to your
# backends. The classifier model (COBAITER_CLASSIFIER_MODEL) is NOT a routable
# target and is intentionally omitted here.

models:
  - model: bbrfkr-llm-general
    description: "コーディング以外の汎用用途。対話・質問応答・数学や論理を含む推論・文章作成・要約・翻訳など。"
    cost: 0
    tier: 3
    context_window: 262144
    multimodal: true
    supports_tools: true
    is_local: true
    fallback_chain: [bbrfkr-llm-general-no-think]

  - model: bbrfkr-llm-general-no-think
    description: "コーディング以外の汎用用途。対話・質問応答・数学や論理を含む推論・文章作成・要約・翻訳など。"
    cost: 0
    tier: 1
    context_window: 262144
    multimodal: false
    supports_tools: true
    is_local: true
    fallback_chain: []

  - model: claude-opus-4-8
    description: "ソフトウェア開発用途。コード生成・リファクタリング・デバッグ・技術設計など。コーディング以外の用途には不向き。"
    cost: 5
    tier: 6
    context_window: 262144
    multimodal: false
    supports_tools: true
    is_local: false
    fallback_chain: [bbrfkr-llm-coding]

  - model: claude-sonnet-4-6
    description: "ソフトウェア開発用途。コード生成・リファクタリング・デバッグ・技術設計など。コーディング以外の用途には不向き。"
    cost: 3
    tier: 4
    context_window: 262144
    multimodal: false
    supports_tools: true
    is_local: false
    fallback_chain: [bbrfkr-llm-coding]

  - model: bbrfkr-llm-coding
    description: "ソフトウェア開発用途。コード生成・リファクタリング・デバッグ・技術設計など。コーディング以外の用途には不向き。"
    cost: 0
    tier: 3
    context_window: 262144
    multimodal: true
    supports_tools: true
    is_local: true
    fallback_chain: [bbrfkr-llm-coding-no-think]

  - model: bbrfkr-llm-coding-no-think
    description: "ソフトウェア開発用途。コード生成・リファクタリング・デバッグ・技術設計など。コーディング以外の用途には不向き。"
    cost: 0
    tier: 1
    context_window: 262144
    multimodal: false
    supports_tools: true
    is_local: true
    fallback_chain: []
