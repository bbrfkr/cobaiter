    context_window: 262144
    multimodal: false
    supports_tools: true
    is_local: true
    fallback_chain: []

  - model: claude-sonnet-5
    description: "ソフトウェア開発・プログラミング全般。コード生成・コードレビュー・リファクタリング・デバッグ・バグ修正。システムやアーキテクチャの技術設計、インフラ運用・CI/CD・障害調査、ライブラリやAPIの使い方相談。"
    task_examples:
