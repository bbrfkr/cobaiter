    cost: 0
    tier: 3
    context_window: 262144
    multimodal: true
    supports_tools: true
    is_local: true
    fallback_chain: [bbrfkr-llm-general-no-think]

  - model: bbrfkr-llm-general-no-think
    description: "雑談・日常会話・質問応答。文章作成・要約・翻訳・校正・タイトル作成。数学や論理を含む一般的な推論、時事や雑学の相談、旅行・レシピ・買い物などの相談ごと。"
