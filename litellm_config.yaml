# Sample LiteLLM gateway config used by docker-compose.
# Map the model names in cobaiter's registry to real providers, and (optionally)
# attach budgets so cobaiter can read credit headroom from /model/info.
#
# Docs: https://docs.litellm.ai/docs/proxy/configs
model_list:
  - model_name: chatgpt/gpt-5.5
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.5
  - model_name: chatgpt/gpt-5.3-codex
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.3-codex
  - model_name: chatgpt/gpt-5.3-codex-spark
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.3-codex-spark
  # Embedding model used by cobaiter's relevance scoring (COBAITER_EMBEDDING_MODEL).
  # Point it at any /v1/embeddings-capable backend (a local one keeps routing fast).
  - model_name: text-embedding-3-small
    model_info:
      mode: embedding
    litellm_params:
      model: openai/text-embedding-3-small

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/COBAITER_LITELLM_API_KEY
